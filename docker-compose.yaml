services:
  redis:
    image: redis:7-alpine
    container_name: pratica06-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - redis_data:/data
    networks:
      - ubuntu_redis_net
    restart: unless-stopped

  ubuntu-server:
    image: ubuntu:24.04
    container_name: pratica06-ubuntu-server
    command: ["sleep", "infinity"]
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ubuntu_redis_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: pratica06-postgres
    environment:
      POSTGRES_DB: pratica
      POSTGRES_USER: pratica
      POSTGRES_PASSWORD: pratica06
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pratica -d pratica"]
      interval: 3s
      timeout: 2s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rocky_postgres_net
    restart: unless-stopped

  rocky-server:
    image: rockylinux:9
    container_name: pratica06-rocky-server
    command: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rocky_postgres_net
    restart: unless-stopped

networks:
  ubuntu_redis_net:
    name: pratica06_ubuntu_redis_net
    driver: bridge
    internal: true
  rocky_postgres_net:
    name: pratica06_rocky_postgres_net
    driver: bridge
    internal: true

volumes:
  redis_data:
    name: pratica06_redis_data
  postgres_data:
    name: pratica06_postgres_data
